name: ci

on:
  push:
    branches:
      - '**'
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v6

      - name: Verify public libraries
        run: |
          set -euo pipefail
          secure_tmp="$HOME/.klib-ci-tmp"
          install -d -m 700 "$secure_tmp"
          ./gradlew clean check publishToMavenLocal centralDryRunBundle \
            -Djava.io.tmpdir="$secure_tmp" \
            --no-daemon --no-configuration-cache

      - name: Check shell scripts
        run: bash -n scripts/*.sh

      - name: Verify remote-only examples with empty caches
        run: ./scripts/verify-remote-examples.sh

name: ci

on:
  push:
    branches:
      - '**'
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: klib-ci-only
          POSTGRES_DB: klib_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      KLIB_POSTGRESQL_TEST_URL: jdbc:postgresql://localhost:5432/klib_test
      KLIB_POSTGRESQL_TEST_USER: postgres
      KLIB_POSTGRESQL_TEST_PASSWORD: klib-ci-only
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v6

      - name: Verify public libraries
        run: |
          set -euo pipefail
          secure_tmp="$HOME/.klib-ci-tmp"
          install -d -m 700 "$secure_tmp"
          ./gradlew clean check publishToMavenLocal centralDryRunBundle \
            -Djava.io.tmpdir="$secure_tmp" \
            --no-daemon --no-configuration-cache

      - name: Check shell scripts
        run: bash -n scripts/*.sh

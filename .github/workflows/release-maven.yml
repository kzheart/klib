name: release-maven

on:
  push:
    tags:
      - 'klib-v*'
      - 'guard-api-v*'
  workflow_dispatch:
    inputs:
      component:
        description: 'Component to publish'
        required: true
        type: choice
        options:
          - klib
          - guard-api
      release_tag:
        description: 'Existing immutable tag to check out and publish'
        required: true
        type: string
      version:
        description: 'Exact component version, without the tag prefix'
        required: true
        type: string
      confirm_publish:
        description: 'Publish the verified signed release to maven.kzheart.me'
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: klib-public-maven
  cancel-in-progress: false

jobs:
  publish:
    name: verify, sign, and publish
    runs-on: ubuntu-latest
    environment: maven-repository
    timeout-minutes: 55
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: klib-ci-only
          POSTGRES_DB: klib_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      KLIB_POSTGRESQL_TEST_URL: jdbc:postgresql://localhost:5432/klib_test
      KLIB_POSTGRESQL_TEST_USER: postgres
      KLIB_POSTGRESQL_TEST_PASSWORD: klib-ci-only
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ inputs.release_tag || github.ref }}

      - name: Validate release gate before any Release request
        id: gate
        shell: bash
        env:
          DISPATCH_COMPONENT: ${{ inputs.component }}
          DISPATCH_RELEASE_TAG: ${{ inputs.release_tag }}
          DISPATCH_VERSION: ${{ inputs.version }}
          DISPATCH_CONFIRMED: ${{ inputs.confirm_publish }}
          MAVEN_SIGNING_KEY: ${{ secrets.MAVEN_SIGNING_KEY }}
          MAVEN_SIGNING_PASSWORD: ${{ secrets.MAVEN_SIGNING_PASSWORD }}
          MAVEN_REPOSITORY_USERNAME: ${{ secrets.MAVEN_REPOSITORY_USERNAME }}
          MAVEN_REPOSITORY_PASSWORD: ${{ secrets.MAVEN_REPOSITORY_PASSWORD }}
        run: |
          set -euo pipefail
          klib_version="$(sed -n 's/^klibVersion=//p' gradle.properties)"
          guard_api_version="$(sed -n 's/^klibGuardApiVersion=//p' gradle.properties)"

          [[ "$klib_version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          [[ "$guard_api_version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            requested_tag="$DISPATCH_RELEASE_TAG"
          else
            [[ "$GITHUB_REF_TYPE" == "tag" ]]
            requested_tag="$GITHUB_REF_NAME"
          fi

          if [[ "$requested_tag" == "klib-v${klib_version}" ]]; then
            component="klib"
            version="$klib_version"
            expected_tag="klib-v${klib_version}"
            bundle="build/distributions/release/klib-${klib_version}.zip"
            gradle_task="prepareKlibReleaseBundle"
          elif [[ "$requested_tag" == "guard-api-v${guard_api_version}" ]]; then
            component="guard-api"
            version="$guard_api_version"
            expected_tag="guard-api-v${guard_api_version}"
            bundle="build/distributions/release/klib-guard-api-${guard_api_version}.zip"
            gradle_task="prepareGuardApiReleaseBundle"
          else
            echo "Tag does not match a configured component version" >&2
            exit 1
          fi

          git tag --points-at HEAD | grep -Fx -- "$expected_tag" >/dev/null
          [[ -z "$(git status --porcelain --untracked-files=all)" ]]

          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            [[ "$DISPATCH_CONFIRMED" == "true" ]]
            [[ "$DISPATCH_COMPONENT" == "$component" ]]
            [[ "$DISPATCH_VERSION" == "$version" ]]
            [[ "$DISPATCH_RELEASE_TAG" == "$expected_tag" ]]
          fi

          [[ -n "${MAVEN_SIGNING_KEY:-}" ]]
          [[ -n "${MAVEN_SIGNING_PASSWORD:-}" ]]
          [[ -n "${MAVEN_REPOSITORY_USERNAME:-}" ]]
          [[ -n "${MAVEN_REPOSITORY_PASSWORD:-}" ]]

          echo "component=$component" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "expected_tag=$expected_tag" >> "$GITHUB_OUTPUT"
          echo "bundle=$bundle" >> "$GITHUB_OUTPUT"
          echo "gradle_task=$gradle_task" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v6

      - name: Check layout and verification scripts
        run: |
          bash -n scripts/*.sh
          python3 -m unittest discover -s scripts/tests -v

      - name: Run full verification and build selected signed bundle
        env:
          MAVEN_SIGNING_KEY: ${{ secrets.MAVEN_SIGNING_KEY }}
          MAVEN_SIGNING_PASSWORD: ${{ secrets.MAVEN_SIGNING_PASSWORD }}
          MAVEN_REPOSITORY_USERNAME: ${{ secrets.MAVEN_REPOSITORY_USERNAME }}
          MAVEN_REPOSITORY_PASSWORD: ${{ secrets.MAVEN_REPOSITORY_PASSWORD }}
          RELEASE_COMPONENT: ${{ steps.gate.outputs.component }}
          RELEASE_TAG: ${{ steps.gate.outputs.expected_tag }}
          RELEASE_TASK: ${{ steps.gate.outputs.gradle_task }}
        run: |
          set -euo pipefail
          secure_tmp="$HOME/.klib-ci-tmp"
          install -d -m 700 "$secure_tmp"
          ./gradlew clean check publishToMavenLocal "$RELEASE_TASK" \
            -PreleaseComponent="$RELEASE_COMPONENT" \
            -PreleaseTag="$RELEASE_TAG" \
            -Djava.io.tmpdir="$secure_tmp" \
            --no-daemon --no-configuration-cache

      - name: Publish immutable release files and verify downloaded bytes
        env:
          MAVEN_REPOSITORY_URL: https://maven.kzheart.me/releases
          MAVEN_REPOSITORY_USERNAME: ${{ secrets.MAVEN_REPOSITORY_USERNAME }}
          MAVEN_REPOSITORY_PASSWORD: ${{ secrets.MAVEN_REPOSITORY_PASSWORD }}
          BUNDLE: ${{ steps.gate.outputs.bundle }}
          COMPONENT: ${{ steps.gate.outputs.component }}
          VERSION: ${{ steps.gate.outputs.version }}
        run: python3 scripts/publish-maven.py "$BUNDLE" --component "$COMPONENT" --version "$VERSION"

      - name: Preserve release evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ steps.gate.outputs.component }}-${{ steps.gate.outputs.version }}
          path: |
            build/distributions/release/*.zip
          if-no-files-found: warn
          retention-days: 30

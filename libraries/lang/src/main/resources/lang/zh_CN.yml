messages:
  common:
    # prefix 是 {prefix} 占位符的来源，按需取消注释并自定义：
    # prefix: "<dark_gray>[</dark_gray><gold>MyPlugin</gold><dark_gray>]</dark_gray> "
    no-permission: "<red>你没有权限执行此操作</red>"
    player-only: "<red>此操作只能由玩家执行</red>"
  command:
    no-permission: "<red>你没有权限执行此命令</red>"
    player-only: "<red>此命令只能由玩家执行</red>"
    incomplete: "<red>命令不完整</red>"
    usage: "<yellow>用法: {usage}</yellow>"
    internal-error: "<red>命令执行出错，请联系管理员（详见控制台）</red>"
    unknown-argument: "<red>未知参数：{argument}</red>"
    suggestion: "<gray>你是不是想输入 {suggestion}？</gray>"
    help:
      header: "<gold>/{command} 帮助 {page}/{pages}</gold>"
      previous: "<gold>[上一页]</gold>"
      next: "<gold>[下一页]</gold>"
      open-page: "<gold>打开第 {page} 页</gold>"
    argument:
      integer: "<red>需要整数</red>"
      integer-range: "<red>整数范围必须为 {minimum}..{maximum}</red>"
      decimal: "<red>需要小数</red>"
      decimal-range: "<red>小数范围必须为 {range}</red>"
      boolean: "<red>需要 true/false、yes/no、on/off 或 1/0</red>"
      choice: "<red>可选值: {choices}</red>"
      player-offline: "<red>玩家不在线: {player}</red>"
      content-empty: "<red>内容不能为空</red>"
    builtin:
      help:
        description: "<gold>查看命令帮助</gold>"
      reload:
        description: "<gold>重新加载插件配置</gold>"
        success: "<green>重新加载完成</green>"
        failure: "<red>重新加载失败: {reason}</red>"
      debug:
        description: "<gold>切换调试模式</gold>"
        enabled: "<green>调试模式已开启</green>"
        disabled: "<yellow>调试模式已关闭</yellow>"
